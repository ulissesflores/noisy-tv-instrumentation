name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt
          pip install pytest

      - name: Integrity — committed provenance chain must verify
        run: python make_provenance.py --verify

      - name: Full replication (results -> tests -> reseal -> verify)
        run: python run_all.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff interrogate

      - name: Ruff format (check)
        run: ruff format --check code tests scripts run_all.py make_provenance.py

      - name: Ruff lint (includes pydocstyle via D rules)
        run: ruff check code tests scripts run_all.py make_provenance.py

      - name: Docstring coverage (interrogate)
        run: interrogate -vv -f 100 code scripts run_all.py make_provenance.py
